  # 放在 https 的 server 块里。例子里的网址是 /live/，文件在 /var/www/live/，按自己的改。
  location = /live {
    return 301 /live/$is_args$args;
  }

  location ^~ /live/ {
    alias /var/www/live/;
    try_files $uri $uri/ =404;
    # 每次打开都向服务器核对一下有没有新版本（没变只回 304，很省）；断网时由页面自己的离线缓存兜底
    add_header Cache-Control "no-cache" always;
  }

  # 记得在 server 或 http 块里给这些类型打开 gzip，默认只压 html：
  # gzip_types text/css application/javascript application/json image/svg+xml;
