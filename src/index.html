<!-- 样式、脚本、目录数据都由 scripts/build.mjs 写进这一页（见下面的占位），第一次打开只等这一个文件 -->
<script>
  // 首帧之前就定好主题、字号和简化特效，免得页面先闪一下
  (function () {
    // 地址少了结尾的斜杠（…/live）时补上，不然图片、数据这些相对路径会指到上一级
    var path = location.pathname;
    if (!/\/$|\.html?$/.test(path)) { location.replace(path + '/' + location.search + location.hash); return; }
    try {
      var p = (JSON.parse(localStorage.getItem('ssd:v1') || '{}').prefs) || {};
      var d = document.documentElement;
      var dark = p.theme === 'dark' || (p.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      d.dataset.theme = dark ? 'dark' : 'light';
      if (p.fs) d.dataset.fs = p.fs;
      if (p.lite) d.dataset.lite = '1';
    } catch (e) {}
  })();
</script>
